<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalpli Fotoğraf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Arka plandaki kalpler için container */
        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Fotoğraf Kartı */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            max-width: 90%;
            max-height: 90vh;
        }

        .card img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 12px;
            display: block;
            object-fit: contain;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Arka plan kalpleri -->
    <div class="hearts-bg" id="heartsContainer"></div>

    <!-- Fotoğraf Alanı -->
    <div class="card">
        <!-- Eğer tarayıcınız HEIC formatını açmazsa, fotoğrafı JPG yapıp burayı "abc.jpg" olarak güncelleyebilirsiniz -->
        <img src="abc.heic" alt="Özel Fotoğraf">
    </div>

    <script>
        // Arka plana otomatik rastgele kalpler ekleyen script
        const container = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💖', '💗', '💓', '💕', '💘'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            // Rastgele konum ve boyutlar
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.floor(Math.random() * 25) + 15) + 'px';
            
            // Rastgele animasyon süresi
            const duration = Math.random() * 3 + 3; // 3 ile 6 saniye arası
            heart.style.animationDuration = duration + 's';
            
            container.appendChild(heart);

            // Animasyon bittiğinde DOM'dan temizle
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Sık aralıklarla kalp üret
        setInterval(createHeart, 300);
    </script>
</body>
</html>
